[versions]
kotlin                 = "2.3.21"
agp                     = "8.7.0"
android-minSdk          = "24"
android-compileSdk      = "35"
vanniktechMavenPublish  = "0.34.0"
ktlint                  = "12.1.2"
detekt                  = "1.23.7"
dokka                   = "2.0.0"
kover                   = "0.9.1"
skie                    = "0.10.14"
kotlinxSerialization    = "1.9.0"
kotlinxCoroutines       = "1.10.1"
ktor                    = "3.5.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Ktor client: core is common to every target; the engines below are the per-platform transports
# (okhttp covers both jvm and android — Ktor's okhttp engine runs fine on Android too, so there's
# no need for a separate ktor-client-android artifact). ktor-client-mock is commonTest-only, used
# by every target including iosTest, so tests never make a real network call.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

[plugins]
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",         version.ref = "kotlin" }
kotlinMultiplatform     = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary          = { id = "com.android.library",              version.ref = "agp"    }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish",     version.ref = "vanniktechMavenPublish" }
ktlint                  = { id = "org.jlleitschuh.gradle.ktlint",    version.ref = "ktlint"  }
detekt                  = { id = "io.gitlab.arturbosch.detekt",      version.ref = "detekt"  }
dokka                   = { id = "org.jetbrains.dokka",              version.ref = "dokka"   }
kover                   = { id = "org.jetbrains.kotlinx.kover",      version.ref = "kover"   }
skie                    = { id = "co.touchlab.skie",                 version.ref = "skie"    }
