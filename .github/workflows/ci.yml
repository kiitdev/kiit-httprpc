name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiit-rpc-kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ktlint
        run: ./gradlew :kiit-rpc:ktlintCheck

      - name: detekt
        run: ./gradlew :kiit-rpc:detekt

      - name: JVM tests (commonTest)
        run: ./gradlew :kiit-rpc:jvmTest

  ios-checks:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kiit-rpc-kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # SKIE's Swift-side compile step needs Xcode/swiftc/xcrun, not just Gradle — a macOS
      # runner, same requirement kiit-codes/kiit-result already have.
      - name: iOS simulator tests (commonTest)
        run: ./gradlew :kiit-rpc:iosSimulatorArm64Test
